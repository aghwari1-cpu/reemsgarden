<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بستان ريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FCFAEC;
    --forest:#1F4B37;
    --forest-soft:#5C7A67;
    --island-top:#8DC24A;
    --island-mid:#6FA83A;
    --island-side:#4C7A2E;
    --island-outline:#3A5D24;
    --line:#2B2B2B;
    --red:#D6432E;
    --orange:#F0923D;
    --yellow:#F6CD5B;
    --pink:#F3AFC7;
    --darkgreen:#2F5233;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--cream);
    color:var(--forest);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 20px 70px;
  }
  h1,h2{ font-family:'Lalezar', sans-serif; font-weight:400; margin:0; letter-spacing:.5px; }

  .hidden{ display:none !important; }

  /* ---------- PLANT / HOME VIEW ---------- */
  #plantView{ width:100%; max-width:1080px; }
  .title{
    text-align:center;
    font-size:clamp(30px,5vw,46px);
    color:var(--forest);
    margin-bottom:34px;
  }
  .plant-layout{
    display:flex;
    gap:40px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
  }

  /* island illustration */
  .island-wrap{ flex:1 1 460px; max-width:560px; }
  .island-wrap svg{ width:100%; height:auto; display:block; }
  .island-hint{
    text-align:center;
    font-size:13px;
    color:var(--forest-soft);
    margin-top:8px;
  }
  .island-flower-img{ cursor:pointer; mix-blend-mode:multiply; }

  /* control panel */
  .panel{
    flex:0 0 400px;
    max-width:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
  }
  .name-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:100%;
  }
  .name-row label{ font-size:13px; color:var(--forest-soft); }
  .name-row input{
    border:1.5px solid var(--forest);
    background:#fff;
    border-radius:999px;
    padding:8px 16px;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    color:var(--forest);
    outline:none;
    width:100%;
  }
  .name-row input:focus{ border-color:var(--darkgreen); }

  .panel-question{
    font-size:15px;
    color:var(--forest-soft);
    margin-top:6px;
  }
  .panel-row{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .swatches{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .swatch{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.15);
    cursor:pointer;
  }
  .swatch.selected{
    outline:2px solid var(--line);
    outline-offset:2px;
  }
  .wheel-swatch{
    width:28px; height:28px;
    border-radius:50%;
    cursor:pointer;
    position:relative;
    background:conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    border:2px solid rgba(0,0,0,0.15);
  }
  .wheel-swatch.selected{
    outline:2px solid var(--line);
    outline-offset:2px;
  }
  .wheel-swatch input[type="color"]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    border:none;
    padding:0;
  }

  .canvas-box{
    position:relative;
    width:340px;
    height:340px;
    max-width:100%;
    border:2px dashed var(--line);
    border-radius:4px;
    background:transparent;
  }
  #drawCanvas{
    width:100%; height:100%;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  .canvas-tools{
    position:absolute;
    top:6px;
    left:6px;
    display:flex;
    gap:6px;
  }
  .icon-btn{
    background:none;
    border:none;
    font-size:16px;
    cursor:pointer;
    color:var(--line);
    line-height:1;
    padding:2px;
  }
  .icon-btn:hover{ color:var(--red); }

  .brush-row{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--forest-soft);
  }
  .brush-row input[type=range]{ width:90px; accent-color:var(--darkgreen); }

  .pill-btn{
    border:1.5px solid var(--forest);
    background:var(--cream);
    color:var(--forest);
    padding:9px 22px;
    border-radius:999px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .pill-btn:hover{ background:#F2EFDD; }
  .pill-btn:disabled{ opacity:.45; cursor:not-allowed; }

  .gallery-link-row{
    width:100%;
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
  }

  /* ---------- GALLERY VIEW ---------- */
  #galleryView{ width:100%; max-width:1200px; }
  .gallery-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:14px;
  }
  .gallery-header h1{ font-size:clamp(26px,4vw,38px); }
  .gallery-count{
    font-size:13px;
    color:var(--forest-soft);
    margin:6px 0 26px;
  }
  .flower-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(56px, 1fr));
    gap:6px;
  }
  .flower-cell{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:8px;
    transition:background .12s ease;
  }
  .flower-cell:hover{ background:rgba(140,180,90,0.18); }
  .flower-cell img{
    width:100%; height:100%;
    object-fit:contain;
    mix-blend-mode:multiply;
  }
  .gallery-status{
    text-align:center;
    color:var(--forest-soft);
    font-size:15px;
    padding:50px 0;
  }

  /* ---------- MODAL ---------- */
  #modalOverlay{
    position:fixed; inset:0;
    background:rgba(30,40,25,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  #modalOverlay.hidden{ display:none; }
  .modal-card{
    background:var(--cream);
    border:2px solid var(--line);
    border-radius:14px;
    padding:26px;
    max-width:280px;
    width:100%;
    text-align:center;
  }
  .modal-card img{
    width:110px; height:110px;
    object-fit:contain;
    margin-bottom:12px;
    mix-blend-mode:multiply;
  }
  .modal-card h3{ font-family:'Lalezar',sans-serif; font-weight:400; color:var(--forest); font-size:20px; margin-bottom:6px; }
  .modal-card p{ color:var(--forest-soft); font-size:13px; margin:0 0 18px; }

  @media (max-width:560px){
    .plant-layout{ flex-direction:column; align-items:center; }
    .panel{ align-items:center; width:100%; max-width:280px; }
  }
</style>
</head>
