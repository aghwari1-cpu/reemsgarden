          <path d="M191.7 189.8 q0.3 -12.7 -2.7 -18.2 M198.7 189.8 q3.3 -10.9 1.3 -16.4 M205.7 191.8 q-0.7 -9.1 5.3 -13.7" stroke="var(--island-outline)" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.8 191.7 189.8;8.8 191.7 189.8;-8.8 191.7 189.8" dur="2.65s" begin="2.34s" repeatCount="indefinite"/></path>
          <path d="M246.4 197.4 q1.3 -11.4 -1.7 -16.3 M253.4 197.4 q4.3 -9.8 2.3 -14.7 M260.4 199.4 q0.3 -8.2 6.3 -12.3" stroke="var(--island-mid)" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.3 246.4 197.4;8.3 246.4 197.4;-8.3 246.4 197.4" dur="2.99s" begin="2.47s" repeatCount="indefinite"/></path>
          <path d="M304.6 204.7 q1.8 -15.9 -1.2 -22.7 M311.6 204.7 q4.8 -13.6 2.8 -20.5 M318.6 206.7 q0.8 -11.4 6.8 -17.0" stroke="var(--island-outline)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-7.7 304.6 204.7;7.7 304.6 204.7;-7.7 304.6 204.7" dur="2.27s" begin="2.60s" repeatCount="indefinite"/></path>
          <path d="M373.0 218.4 q5.4 -14.0 2.4 -20.0 M380.0 218.4 q8.4 -12.0 6.4 -18.0 M387.0 220.4 q4.4 -10.0 10.4 -15.0" stroke="var(--island-mid)" stroke-width="2.7" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.0 373.0 218.4;8.0 373.0 218.4;-8.0 373.0 218.4" dur="2.19s" begin="2.73s" repeatCount="indefinite"/></path>
          <path d="M200.7 271.4 q2.0 -13.2 -1.0 -18.8 M207.7 271.4 q5.0 -11.3 3.0 -16.9 M214.7 273.4 q1.0 -9.4 7.0 -14.1" stroke="var(--island-outline)" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-7.3 200.7 271.4;7.3 200.7 271.4;-7.3 200.7 271.4" dur="2.16s" begin="2.86s" repeatCount="indefinite"/></path>
          <path d="M255.5 294.7 q1.9 -17.0 -1.1 -24.3 M262.5 294.7 q4.9 -14.6 2.9 -21.9 M269.5 296.7 q0.9 -12.2 6.9 -18.3" stroke="var(--island-mid)" stroke-width="2.1" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-7.3 255.5 294.7;7.3 255.5 294.7;-7.3 255.5 294.7" dur="1.95s" begin="2.99s" repeatCount="indefinite"/></path>
          <path d="M321.2 285.3 q2.3 -15.2 -0.7 -21.8 M328.2 285.3 q5.3 -13.1 3.3 -19.6 M335.2 287.3 q1.3 -10.9 7.3 -16.3" stroke="var(--island-outline)" stroke-width="3.0" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-9.7 321.2 285.3;9.7 321.2 285.3;-9.7 321.2 285.3" dur="2.65s" begin="3.12s" repeatCount="indefinite"/></path>
          <path d="M379.0 254.5 q3.2 -18.5 0.2 -26.4 M386.0 254.5 q6.2 -15.8 4.2 -23.8 M393.0 256.5 q2.2 -13.2 8.2 -19.8" stroke="var(--island-mid)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-9.6 379.0 254.5;9.6 379.0 254.5;-9.6 379.0 254.5" dur="2.81s" begin="3.25s" repeatCount="indefinite"/></path>
          <path d="M144.3 231.9 q1.3 -18.0 -1.7 -25.7 M151.3 231.9 q4.3 -15.4 2.3 -23.1 M158.3 233.9 q0.3 -12.8 6.3 -19.3" stroke="var(--island-outline)" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.2 144.3 231.9;8.2 144.3 231.9;-8.2 144.3 231.9" dur="2.27s" begin="3.38s" repeatCount="indefinite"/></path>
          <path d="M229.9 155.8 q4.5 -18.3 1.5 -26.1 M236.9 155.8 q7.5 -15.7 5.5 -23.5 M243.9 157.8 q3.5 -13.1 9.5 -19.6" stroke="var(--island-mid)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-6.3 229.9 155.8;6.3 229.9 155.8;-6.3 229.9 155.8" dur="1.86s" begin="3.51s" repeatCount="indefinite"/></path>
          <path d="M300.1 152.8 q5.9 -17.6 2.9 -25.1 M307.1 152.8 q8.9 -15.1 6.9 -22.6 M314.1 154.8 q4.9 -12.6 10.9 -18.8" stroke="var(--island-outline)" stroke-width="3.0" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.5 300.1 152.8;8.5 300.1 152.8;-8.5 300.1 152.8" dur="2.78s" begin="3.64s" repeatCount="indefinite"/></path>
          <path d="M365.6 171.6 q2.7 -14.1 -0.3 -20.2 M372.6 171.6 q5.7 -12.1 3.7 -18.2 M379.6 173.6 q1.7 -10.1 7.7 -15.2" stroke="var(--island-mid)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.65"><animateTransform attributeName="transform" type="rotate" values="-8.7 365.6 171.6;8.7 365.6 171.6;-8.7 365.6 171.6" dur="2.85s" begin="3.77s" repeatCount="indefinite"/></path>
        </g>

        <!-- real planted flowers appear here once someone plants one -->
        <g id="islandFlowers"></g>
      </svg>
      <p class="island-hint" id="islandHint">لسه محدش زرع وردة هنا... زرعتك ممكن تكون أول واحدة 🌱</p>
    </div>

    <div class="panel">
      <div class="name-row">
        <label for="nameInput">اسمك</label>
        <input id="nameInput" type="text" maxlength="30" placeholder="اكتب اسمك هنا">
      </div>

      <div class="panel-question">أضف وردة لبستاننا؟</div>

      <div class="panel-row">
        <div class="swatches" id="palette"></div>

        <div class="canvas-box">
          <canvas id="drawCanvas" width="340" height="340"></canvas>
          <div class="canvas-tools">
            <button class="icon-btn" id="undoBtn" title="تراجع خطوة">↺</button>
            <button class="icon-btn" id="clearBtn" title="امسح الكل">🗑</button>
          </div>
        </div>
      </div>

      <div class="brush-row">
        <span>سُمك الفرشاة</span>
        <input type="range" id="brushSize" min="2" max="14" value="5">
      </div>

      <button class="pill-btn" id="plantBtn" disabled>🌱 ازرع</button>

      <div class="gallery-link-row">
        <button class="pill-btn" id="goGalleryBtn">🖼️ شاهد معرض الزهور</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== GALLERY VIEW ===================== -->
<div id="galleryView" class="hidden">
  <div class="gallery-header">
    <div>
      <h1>معرض الزهور</h1>
      <div class="gallery-count" id="galleryCount"></div>
    </div>
    <button class="pill-btn" id="backBtn">→ العودة للبستان</button>
  </div>
  <div class="flower-grid" id="flowerGrid">
    <div class="gallery-status" id="galleryStatus">جاري تحميل الزهور... 🌸</div>
  </div>
</div>

<!-- ===================== MODAL ===================== -->
<div id="modalOverlay" class="hidden">
  <div class="modal-card">
    <img id="modalImg" src="" alt="زهرة">
    <h3 id="modalName"></h3>
    <p id="modalDate"></p>
    <button class="pill-btn" id="modalClose">إغلاق</button>
  </div>
</div>

<script>
(function(){
  const COLORS = [
    { c:'var(--red)', hex:'#D6432E' },
    { c:'var(--orange)', hex:'#F0923D' },
    { c:'var(--yellow)', hex:'#F6CD5B' },
    { c:'var(--pink)', hex:'#F3AFC7' },
    { c:'var(--darkgreen)', hex:'#2F5233' }
  ];
  let currentColor = COLORS[0].hex;
  let currentSize = 5;
  let strokes = [];
  let drawing = false;

  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const nameInput = document.getElementById('nameInput');
  const plantBtn = document.getElementById('plantBtn');

  // palette
  const palette = document.getElementById('palette');
  COLORS.forEach((col, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = col.hex;
    sw.addEventListener('click', () => {
      currentColor = col.hex;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      document.querySelectorAll('.wheel-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
    palette.appendChild(sw);
  });

  // color wheel swatch
  const wheelSwatch = document.createElement('div');
  wheelSwatch.className = 'wheel-swatch';
  wheelSwatch.title = 'عجلة الألوان';
  wheelSwatch.innerHTML = '<input type="color" id="wheelInput" value="#8E5AA0">';
  palette.appendChild(wheelSwatch);
  const wheelInput = wheelSwatch.querySelector('#wheelInput');
  wheelInput.addEventListener('input', () => {
    currentColor = wheelInput.value;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    document.querySelectorAll('.wheel-swatch').forEach(s => s.classList.remove('selected'));
    wheelSwatch.classList.add('selected');
  });

  document.getElementById('brushSize').addEventListener('input', e => {
    currentSize = Number(e.target.value);
  });

  function updatePlantBtn(){
    plantBtn.disabled = nameInput.value.trim().length === 0 || strokes.length === 0;
  }
  nameInput.addEventListener('input', updatePlantBtn);

  function redraw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    strokes.forEach(s => {
      if(s.points.length === 0) return;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      if(s.points.length === 1){ ctx.lineTo(s.points[0].x+0.1, s.points[0].y+0.1); }
      s.points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
    });
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function startDraw(e){
    e.preventDefault();
    drawing = true;
    strokes.push({ color: currentColor, size: currentSize, points:[getPos(e)] });
    redraw();
    updatePlantBtn();
  }
  function moveDraw(e){
    if(!drawing) return;
    e.preventDefault();
    strokes[strokes.length-1].points.push(getPos(e));
    redraw();
  }
  function endDraw(){ drawing = false; updatePlantBtn(); }

  canvas.addEventListener('pointerdown', startDraw);
  canvas.addEventListener('pointermove', moveDraw);
  window.addEventListener('pointerup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  document.getElementById('undoBtn').addEventListener('click', () => {
    strokes.pop(); redraw(); updatePlantBtn();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    strokes = []; redraw(); updatePlantBtn();
  });

  document.getElementById('plantBtn').addEventListener('click', async () => {
    if(strokes.length === 0 || nameInput.value.trim().length === 0) return;
    plantBtn.disabled = true;
    plantBtn.textContent = 'جاري الزرع...';
    try{
      const image = canvas.toDataURL('image/png');
      const flower = { name: nameInput.value.trim(), date: new Date().toISOString(), image };
      const key = 'flower:' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      const result = await window.storage.set(key, JSON.stringify(flower), true);
      if(!result) throw new Error('save failed');
      strokes = [];
      redraw();
      plantBtn.textContent = '🌱 ازرع';
      updatePlantBtn();
      await loadIslandFlowers();
    }catch(err){
      console.error(err);
      alert('حصلت مشكلة تقنية في حفظ الوردة (مفيش أي فحص على شكل الرسمة أبداً):\n' + (err && err.message ? err.message : err) + '\nجرّب تاني.');
      plantBtn.textContent = '🌱 ازرع';
      updatePlantBtn();
    }
  });

  // ---------- island (shows real planted flowers) ----------
  const ISLAND_SLOTS = [
    {x:148, y:130}, {x:338, y:90}, {x:428, y:170}, {x:248, y:340},
    {x:388, y:300}, {x:118, y:300}, {x:308, y:230}, {x:208, y:270},
    {x:188, y:190}, {x:368, y:230}, {x:288, y:320}, {x:448, y:270},
    {x:158, y:230}, {x:328, y:170}
  ];

  async function fetchAllFlowers(){
    const listResult = await window.storage.list('flower:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const flowers = [];
    for(const key of keys){
      try{
        const item = await window.storage.get(key, true);
        if(item && item.value) flowers.push({ id:key, ...JSON.parse(item.value) });
      }catch(e){ console.error('load error', key, e); }
    }
    flowers.sort((a,b) => new Date(b.date) - new Date(a.date));
    return flowers;
  }

  async function loadIslandFlowers(){
    const group = document.getElementById('islandFlowers');
    const hint = document.getElementById('islandHint');
    try{
      const flowers = await fetchAllFlowers();
      group.innerHTML = '';
      if(flowers.length === 0){
        hint.classList.remove('hidden');
        return;
      }
      hint.classList.add('hidden');
      const shown = flowers.slice(0, ISLAND_SLOTS.length);
      shown.forEach((f, i) => {
        const slot = ISLAND_SLOTS[i];
        const size = 46;
        const ns = 'http://www.w3.org/2000/svg';
        const baseX = slot.x, baseY = slot.y + size/2 + 10;

        // wrapper group: everything sways together around the flower's base
        const wrap = document.createElementNS(ns, 'g');
        const amp = (3 + (i % 4)).toFixed(1);
        const dur = (2.6 + (i % 5) * 0.35).toFixed(2);
        const begin = (i * 0.22).toFixed(2);
        const anim = document.createElementNS(ns, 'animateTransform');
        anim.setAttribute('attributeName', 'transform');
        anim.setAttribute('type', 'rotate');
        anim.setAttribute('values', `-${amp} ${baseX} ${baseY};${amp} ${baseX} ${baseY};-${amp} ${baseX} ${baseY}`);
        anim.setAttribute('dur', dur + 's');
        anim.setAttribute('begin', begin + 's');
        anim.setAttribute('repeatCount', 'indefinite');
        wrap.appendChild(anim);

        // soft grounding shadow so the flower feels planted, not stuck on top
        const shadow = document.createElementNS(ns, 'ellipse');
        shadow.setAttribute('cx', baseX);
        shadow.setAttribute('cy', baseY + 3);
        shadow.setAttribute('rx', size/3.2);
        shadow.setAttribute('ry', size/10);
        shadow.setAttribute('fill', 'var(--island-outline)');
        shadow.setAttribute('opacity', '0.28');
        wrap.appendChild(shadow);

        const stem = document.createElementNS(ns, 'line');
        stem.setAttribute('x1', slot.x); stem.setAttribute('y1', slot.y + size/2 - 4);
        stem.setAttribute('x2', baseX); stem.setAttribute('y2', baseY);
        stem.setAttribute('stroke', 'var(--island-outline)');
        stem.setAttribute('stroke-width', '2.5');
        stem.setAttribute('stroke-linecap', 'round');
        wrap.appendChild(stem);

        const img = document.createElementNS(ns, 'image');
        img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', f.image);
        img.setAttribute('href', f.image);
        img.setAttribute('x', slot.x - size/2);
        img.setAttribute('y', slot.y - size/2);
        img.setAttribute('width', size);
        img.setAttribute('height', size);
        img.setAttribute('class', 'island-flower-img');
        img.addEventListener('click', () => openModal(f));
        const title = document.createElementNS(ns, 'title');
        title.textContent = f.name || 'زهرة';
        img.appendChild(title);
        wrap.appendChild(img);

        group.appendChild(wrap);
      });
    }catch(err){
      console.error('island load error', err);
    }
  }
  loadIslandFlowers();

  // ---------- view switching ----------
  const plantView = document.getElementById('plantView');
  const galleryView = document.getElementById('galleryView');
  document.getElementById('goGalleryBtn').addEventListener('click', showGallery);
  document.getElementById('backBtn').addEventListener('click', () => {
    galleryView.classList.add('hidden');
    plantView.classList.remove('hidden');
    loadIslandFlowers();
  });
  function showGallery(){
    plantView.classList.add('hidden');
    galleryView.classList.remove('hidden');
    loadGallery();
  }

  // ---------- gallery ----------
  async function loadGallery(){
    const grid = document.getElementById('flowerGrid');
    const statusEl = document.getElementById('galleryStatus');
    const countEl = document.getElementById('galleryCount');
    grid.innerHTML = '<div class="gallery-status" id="galleryStatus">جاري تحميل الزهور... 🌸</div>';
    countEl.textContent = '';

    try{
      const flowers = await fetchAllFlowers();

      if(flowers.length === 0){
        grid.innerHTML = '<div class="gallery-status">البستان لسه فاضي... كن أول من يزرع وردة 🌱</div>';
        return;
      }

      grid.innerHTML = '';
      countEl.textContent = flowers.length + ' زهرة إجمالاً';

      flowers.forEach(f => {
        const cell = document.createElement('div');
        cell.className = 'flower-cell';
        cell.innerHTML = `<img src="${f.image}" alt="زهرة ${f.name || ''}">`;
        cell.addEventListener('click', () => openModal(f));
        grid.appendChild(cell);
      });
    }catch(err){
      console.error('gallery load error', err);
      grid.innerHTML = '<div class="gallery-status">تعذر تحميل البستان، حاول تحدّث الصفحة.</div>';
    }
  }

  function openModal(f){
    document.getElementById('modalImg').src = f.image;
    document.getElementById('modalName').textContent = f.name || 'بدون اسم';
    let dateStr = f.date;
    try{ dateStr = new Date(f.date).toLocaleString('ar-EG', { dateStyle:'medium', timeStyle:'short' }); }catch(e){}
    document.getElementById('modalDate').textContent = 'رُسمت في: ' + dateStr;
    document.getElementById('modalOverlay').classList.remove('hidden');
  }
  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.add('hidden');
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if(e.target.id === 'modalOverlay') e.currentTarget.classList.add('hidden');
  });
})();
</script>
</body>
</html>
